apiVersion: v1
kind: ConfigMap
metadata:
  name: sp-migration-config
  namespace: storage-pool-migrator-system
data:
  STORAGE_SNAPSHOT_CLASS: "storage-migration-snapshotclass"
  NEW_STORAGE_CLASS: "storage-migration-class"
  DELETE_OLD_VOLUME_CLAIMS: "true"
  tolerations.yaml: |
      - key: "migration-node-pool"
        value: "true"
        operator: "Equal"
        effect: "NoSchedule"
  old_tolerations.yaml: |
      - key: "old-taint"
        value: "true"
        operator: "Equal"
        effect: "NoSchedule"